<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1218"><title>Linha de Fundo · Manager</title></head><body style="margin:0;background:#0b1218;color:#fff;font-family:system-ui"><div id="app"><div style="padding:25px">Preparando o vestiário…</div></div><script>(async()=>{try{const parts=await Promise.all(Array.from({length:8},(_,i)=>fetch('pack'+i+'.txt').then(r=>{if(!r.ok)throw Error('Arquivo indisponível');return r.text()})));const b=atob(parts.join(''));const bytes=Uint8Array.from(b,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const o=JSON.parse(await new Response(stream).text());for(const n of ['style.css','tactical.css','market.css','match.css']){const s=document.createElement('style');s.textContent=o[n];document.head.appendChild(s)}for(const n of ['tactical.js','market.js','match.js','app.js']){const s=document.createElement('script');s.textContent=o[n];document.body.appendChild(s)}}catch(e){document.getElementById('app').textContent='Não foi possível carregar o jogo. Verifique sua conexão e use um navegador atualizado.';console.error(e)}})()</script></body></html>
